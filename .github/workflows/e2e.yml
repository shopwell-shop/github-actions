name: E2E Tests
on:
  workflow_call:
    inputs:
      extensionName:
        description: "Your extension name"
        required: true
        type: string
      e2ePath:
        description: "Path to your e2e tests"
        required: true
        type: string
      e2eTestFramework:
        description: "Choose the test framework to run (playwright or cypress)"
        required: true
        type: string
        default: "cypress"
      shopwellVersion:
        description: |
          With the default `.auto`, the workflow tries to find a shopwell version using the shopwell-version action.

          For example, if the current ref is next-1234, it will try to find the ref next-1234 in shopwell-shop/shopwell. If there's no matching ref, it will use shopwellVersionFallback
        required: false
        type: string
        default: ".auto"
      shopwellVersionFallback:
        required: false
        type: string
        default: trunk
      phpVersion:
        required: false
        type: string
        default: "8.2"
      mysqlVersion:
        required: false
        type: string
        default: "builtin"
      composerRootVersion:
        required: false
        type: string
        default: ".auto"
      dependencies:
        required: false
        type: string
    secrets:
      env:
        description: "ENV variables to substitute in to plugin repository urls"
        required: false

jobs:
  run:
    name: Tests
    runs-on: ubuntu-latest
    env:
      SHOPWELL_ACCESS_KEY_ID: ${{ secrets.SHOPWELL_ACCESS_KEY_ID }}
      SHOPWELL_SECRET_ACCESS_KEY: ${{ secrets.SHOPWELL_SECRET_ACCESS_KEY }}
    steps:
      - uses: shopwell-shop/github-actions/shopwell-version@65054d0ba7d1e4c53af3d7ef816cbc1aebc4b8ad
        with:
          fallback: ${{ inputs.shopwellVersionFallback }}
        id: version
        if: ${{ inputs.shopwellVersion == '.auto' || inputs.shopwellVersion == '' }}
      - name: Setup Shopwell
        uses: shopwell-shop/setup-shopwell@main
        with:
          shopwell-version: ${{ steps.version.outputs.shopwell-version || inputs.shopwellVersion }}
          php-version: ${{ inputs.phpVersion }}
          mysql-version: ${{ inputs.mysqlVersion }}
          composer-root-version: ${{ inputs.composerRootVersion }}
          install: true
          env: e2e
          install-storefront: true
          install-admin: true
          allow-insecure-versions: true
      - name: Clone Extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: custom/plugins/${{ inputs.extensionName }}
      - name: Clone Dependencies
        if: inputs.dependencies
        env:
          DEPS: ${{ inputs.dependencies }}
        run: |
          IFS=$'\n'
          for token in $(echo "${{secrets.env}}"); do
            export $token
          done
          for dep in $(echo "$DEPS" | envsubst | jq -c '.[]'); do
            dep_name=$(echo "$dep" | jq -r '.name')
            dep_repo=$(echo "$dep" | jq -r '.repo')
            git clone "$dep_repo" "custom/plugins/$dep_name"
          done
      - name: Install extension with Composer
        run: |
          composer require $(composer -d custom/plugins/${{ inputs.extensionName }} config name)
          ./bin/console plugin:refresh
          ./bin/console plugin:install ${{ inputs.extensionName }} --activate --clearCache
      - name: Run E2E test
        working-directory: custom/plugins/${{ inputs.extensionName }}/${{ inputs.e2ePath }}
        run: |
          npm install
          if [ "${{ inputs.e2eTestFramework }}" == "playwright" ]; then
            npx playwright install
            npx playwright install-deps
            npx playwright test
          elif [ "${{ inputs.e2eTestFramework }}" == "cypress" ]; then
            CYPRESS_baseUrl=http://localhost:8000 node_modules/.bin/cypress run --browser chrome
          else
            echo "Invalid test framework specified. Please choose either 'cypress' or 'playwright'."
            exit 1
          fi
      - name: Upload Playwright Artifacts
        if: ${{ inputs.e2eTestFramework == 'playwright' && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-screenshots
          path: custom/plugins/${{ inputs.extensionName }}/${{ inputs.e2ePath }}/test-results
      - name: Upload Cypress Artifacts
        if: ${{ inputs.e2eTestFramework == 'cypress' && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-screenshots
          path: custom/plugins/${{ inputs.extensionName }}/${{ inputs.e2ePath }}/cypress/screenshots