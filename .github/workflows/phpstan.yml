name: Run PHPStan
on:
  workflow_call:
    secrets:
      env:
        required: false
    inputs:
      extensionName:
        description: "Your extension name"
        required: true
        type: string
      shopwellVersion:
        description: |
          With the default `.auto`, the workflow tries to find a shopwell version using the shopwell-version action.

          For example, if the current ref is next-1234, it will try to find the ref next-1234 in shopwell-shop/shopwell. If there's no matching ref, it will use shopwellVersionFallback
        required: false
        type: string
        default: ".auto"
      shopwellVersionFallback:
        required: false
        type: string
        default: trunk
      shopwell-repository:
        description: The shopwell repository to checkout
        type: string
        default: shopwell-shop/shopwell
      composerRootVersion:
        required: false
        type: string
        default: ".auto"
      dependencies:
        required: false
        type: string
      runner:
        required: false
        type: string
        default: ubuntu-latest
env:
  SHOPWELL_TOOL_CACHE_PHPSTAN: ${{ github.workspace }}/var/phpstan

jobs:
  run:
    name: Static Analyse
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: shopwell-shop/github-actions/shopwell-version@65054d0ba7d1e4c53af3d7ef816cbc1aebc4b8ad
        with:
          fallback: ${{ inputs.shopwellVersionFallback }}
          repo: ${{ inputs.shopwell-repository }}
        id: version
        if: ${{ inputs.shopwellVersion == '.auto' || inputs.shopwellVersion == '' }}
      - name: Setup Shopwell
        uses: shopwell-shop/setup-shopwell@main
        with:
          shopwell-version: ${{ steps.version.outputs.shopwell-version || inputs.shopwellVersion }}
          shopwell-repository: ${{ inputs.shopwell-repository }}
          composer-root-version: ${{ inputs.composerRootVersion }}
          php-version: 8.2
          env: prod
          install: "true"
          allow-insecure-versions: true
      - name: Clone Extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: custom/plugins/${{ inputs.extensionName }}
      - name: Clone Dependencies
        if: inputs.dependencies
        env:
          DEPS: ${{ inputs.dependencies }}
        run: |
          IFS=$'\n'
          for token in $(echo "${{secrets.env}}"); do
            export $token
          done
          for dep in $(echo "$DEPS" | envsubst | jq -c '.[]'); do
            dep_name=$(echo "$dep" | jq -r '.name')
            dep_repo=$(echo "$dep" | jq -r '.repo')
            git clone "$dep_repo" "custom/plugins/$dep_name"
          done
      - name: Install dependencies with Composer
        if: inputs.dependencies
        env:
          DEPS: ${{ inputs.dependencies }}
        run: |
          IFS=$'\n'
          for dep in $(echo "$DEPS" | envsubst | jq -c '.[]'); do
            dep_name=$(echo "$dep" | jq -r '.name')
            composer require $(composer -d "custom/plugins/$dep_name" config name)
          done
      - name: Install extension with Composer
        run: composer require $(composer -d custom/plugins/${{ inputs.extensionName }} config name)
      - name: Create phpstan.neon
        working-directory: custom/plugins/${{ inputs.extensionName }}
        run: |
          printf "parameters:\n  tmpDir: ${{ env.SHOPWELL_TOOL_CACHE_PHPSTAN }}\nincludes:\n  - phpstan.neon.dist" > phpstan.neon
      - name: PHPStan cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SHOPWELL_TOOL_CACHE_PHPSTAN }}
          key: ${{ runner.OS }}-${{ github.repository }}-phpstan-${{ github.sha }}
          restore-keys: |
            ${{ runner.OS }}-${{ github.repository }}-phpstan-
      - name: Refresh
        run: bin/console plugin:refresh
      - name: Install extension dependencies
        if: inputs.dependencies
        run: |
          IFS=$'\n'
          for dep in $(echo "$DEPS" | envsubst | jq -c '.[]'); do
            dep_name=$(echo "$dep" | jq -r '.name')
            bin/console plugin:install --activate $dep_name
          done
      - name: Install Extension
        run: bin/console plugin:install --activate ${{ inputs.extensionName }}
      - name: Build PHPStan Bootstrap
        run: php ${{ github.workspace }}/src/Core/DevOps/StaticAnalyze/phpstan-bootstrap.php
      - name: Run PHPStan
        working-directory: custom/plugins/${{ inputs.extensionName }}
        run: ${{ github.workspace }}/vendor/bin/phpstan analyze --error-format=github --no-progress
