name: PHPUnit
on:
  workflow_call:
    inputs:
      extensionName:
        description: "Your extension name"
        required: true
        type: string
      shopwellVersion:
        description: |
          With the default `.auto`, the workflow tries to find a shopwell version using the shopwell-version action.

          For example, if the current ref is next-1234, it will try to find the ref next-1234 in shopwell-shop/shopwell. If there's no matching ref, it will use shopwellVersionFallback
        required: false
        type: string
        default: ".auto"
      shopwellVersionFallback:
        required: false
        type: string
        default: trunk
      shopwell-repository:
        description: The shopwell repository to checkout
        type: string
        default: shopwell-shop/shopwell
      phpVersion:
        required: false
        type: string
        default: "8.2"
      mysqlVersion:
        required: false
        type: string
        default: "builtin"
      composerRootVersion:
        required: false
        type: string
        default: ".auto"
      dependencies:
        required: false
        type: string
      uploadCoverage:
        description: "Upload coverage to codecov"
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: ubuntu-latest
      filterName:
        description: "PHPUnit 11 requires a testsuite filter"
        required: false
        type: string
        default: ""
    secrets:
      codecovToken:
        description: "Codecov token"
        required: false
      env:
        description: "ENV variables to substitute in to plugin repository urls"
        required: false

jobs:
  run:
    name: Tests
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: shopwell-shop/github-actions/shopwell-version@main
        with:
          fallback: ${{ inputs.shopwellVersionFallback }}
          repo: ${{ inputs.shopwell-repository }}
        id: version
        if: ${{ inputs.shopwellVersion == '.auto' || inputs.shopwellVersion == '' }}
      - name: Setup Shopwell
        uses: shopwell-shop/setup-shopwell@main
        with:
          shopwell-version: ${{ steps.version.outputs.shopwell-version || inputs.shopwellVersion }}
          shopwell-repository: ${{ inputs.shopwell-repository }}
          php-version: ${{ inputs.phpVersion }}
          mysql-version: ${{ inputs.mysqlVersion }}
          composer-root-version: ${{ inputs.composerRootVersion }}
          php-extensions: pcov
          allow-insecure-versions: true
      - name: Clone Extension
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: custom/plugins/${{ inputs.extensionName }}
      - name: Clone Dependencies
        if: inputs.dependencies
        env:
          DEPS: ${{ inputs.dependencies }}
        run: |
          IFS=$'\n'
          for token in $(echo "${{secrets.env}}"); do
            export $token
          done
          for dep in $(echo "$DEPS" | envsubst | jq -c '.[]'); do
            dep_name=$(echo "$dep" | jq -r '.name')
            dep_repo=$(echo "$dep" | jq -r '.repo')
            git clone "$dep_repo" "custom/plugins/$dep_name"
          done
      - name: Install extension with Composer
        run: composer require $(composer -d custom/plugins/${{ inputs.extensionName }} config name)
      - name: Run PHPUnit
        working-directory: custom/plugins/${{ inputs.extensionName }}
        run: |
          if [ -n "${{ inputs.filterName }}" ]; then
            ${{ github.workspace }}/vendor/bin/phpunit --testsuite ${{ inputs.filterName }} --coverage-clover clover.xml
          else
            ${{ github.workspace }}/vendor/bin/phpunit --coverage-clover clover.xml
          fi
      - name: Upload Coverage
        if: inputs.uploadCoverage == true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.codecovToken }}
        with:
          root_dir: ${{ github.workspace }}/custom/plugins/${{ inputs.extensionName }}
          working-directory: ${{ github.workspace }}/custom/plugins/${{ inputs.extensionName }}
          files: ./clover.xml
