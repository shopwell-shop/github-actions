name: update-saas-refs
description: "Update upstream refs referenced in release/deployment branches"
author: "Shopwell"
branding:
  color: "blue"
  icon: "download"

inputs:
  pull_request:
    required: true
    default: ${{ github.event.pull_request }}
    description: The pull request that triggered the update
  target-branch:
    required: false
    default: ${{ github.base_ref }}
    description: Deployment branch to update, e.g. 6.7.8.x

runs:
  using: "composite"
  steps:
        - uses: shopwell-shop/octo-sts-action@c0ea7b858a7f5719ff14390f67dd770a2defd203
          id: sts
          with:
            scope: shopwell-shop/saas
            identity: SaaSCoreUpdate
        - name: Check target branch exists in saas repo
          id: check_branch
          shell: bash
          env:
            GH_TOKEN: ${{ steps.sts.outputs.token }}
          run: |
            if gh api repos/shopwell-shop/saas/branches/"${{ inputs.target-branch }}" >/dev/null 2>&1; then
              echo "branch_exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "branch_exists=false" >> "$GITHUB_OUTPUT"
            fi
        - name: Trigger saas saas core-update
          shell: bash
          if: ${{ steps.check_branch.outputs.branch_exists == 'true' }}
          env:
            ASSIGNEE: ${{ inputs.pull_request.assignee.login || inputs.pull_request.user.login }}
            GH_TOKEN: ${{ steps.sts.outputs.token }}
          run: |
            gh workflow run "core-update.yml" --repo "shopwell-shop/saas" --ref "${{ inputs.target-branch }}" -f upstream-assignee="$ASSIGNEE" -f upstream-pr="${{ inputs.pull_request.url }}"
